# =============================================================================
#  Crackerbox Website — Cloudflare Pages Deployment
# =============================================================================
#  This workflow handles the full deployment lifecycle for the Crackerbox
#  static website to Cloudflare Pages. It is designed to be:
#
#    • Idempotent  — creates the project if it doesn't exist, deploys if it does
#    • Observable  — every stage emits structured logs and a summary
#    • Resilient   — retries transient failures, validates before and after
#    • Reusable    — can be triggered by other workflows or manually
#
#  Triggers:
#    1. workflow_call  — invoked by build.yml after a successful CI pass
#    2. workflow_dispatch — manual deploy with environment selector
# =============================================================================

name: "Deploy → Cloudflare Pages"

on:
  # ---------------------------------------------------------------------------
  # Called by other workflows (e.g., build.yml)
  # ---------------------------------------------------------------------------
  workflow_call:
    inputs:
      environment:
        description: "Target environment (preview | production)"
        required: false
        type: string
        default: "preview"
      commit_sha:
        description: "Git SHA that triggered this deployment"
        required: false
        type: string
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

  # ---------------------------------------------------------------------------
  # Manual trigger from the Actions tab
  # ---------------------------------------------------------------------------
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - preview
          - production
        default: "preview"

# =============================================================================
#  Constants
# =============================================================================
env:
  PROJECT_NAME: "crackerbox"
  DEPLOY_DIRECTORY: "apps/web"
  WRANGLER_VERSION: "4"                    # pin major version for stability

# =============================================================================
#  Jobs
# =============================================================================
jobs:
  # ---------------------------------------------------------------------------
  #  1 ▸ Pre-flight checks
  # ---------------------------------------------------------------------------
  preflight:
    name: "🔍 Pre-flight"
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      branch: ${{ steps.resolve.outputs.branch }}
      sha_short: ${{ steps.resolve.outputs.sha_short }}
      deploy_timestamp: ${{ steps.resolve.outputs.deploy_timestamp }}
    steps:
      - name: Resolve deployment parameters
        id: resolve
        run: |
          # Determine environment
          ENV="${{ inputs.environment || 'preview' }}"
          echo "environment=${ENV}" >> "$GITHUB_OUTPUT"

          # Determine branch
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          # Short SHA (use input if provided, otherwise derive)
          SHA="${{ inputs.commit_sha }}"
          if [[ -z "$SHA" ]]; then
            SHA="${GITHUB_SHA}"
          fi
          echo "sha_short=${SHA:0:7}" >> "$GITHUB_OUTPUT"

          # Timestamp
          echo "deploy_timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Print deployment plan
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║           CRACKERBOX DEPLOYMENT PLAN                    ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║  Project:      ${{ env.PROJECT_NAME }}"
          echo "║  Environment:  ${{ steps.resolve.outputs.environment }}"
          echo "║  Branch:       ${{ steps.resolve.outputs.branch }}"
          echo "║  Commit:       ${{ steps.resolve.outputs.sha_short }}"
          echo "║  Timestamp:    ${{ steps.resolve.outputs.deploy_timestamp }}"
          echo "║  Directory:    ${{ env.DEPLOY_DIRECTORY }}"
          echo "╚══════════════════════════════════════════════════════════╝"

  # ---------------------------------------------------------------------------
  #  2 ▸ Validate static assets
  # ---------------------------------------------------------------------------
  validate:
    name: "✅ Validate Assets"
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4

      - name: Verify deploy directory exists
        run: |
          if [[ ! -d "${{ env.DEPLOY_DIRECTORY }}" ]]; then
            echo "::error::Deploy directory '${{ env.DEPLOY_DIRECTORY }}' not found."
            exit 1
          fi

      - name: Verify index.html exists
        run: |
          if [[ ! -f "${{ env.DEPLOY_DIRECTORY }}/index.html" ]]; then
            echo "::error::index.html not found in '${{ env.DEPLOY_DIRECTORY }}'."
            exit 1
          fi

      - name: Asset inventory
        run: |
          echo "### 📦 Deploy Payload" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"

          FILE_COUNT=$(find "${{ env.DEPLOY_DIRECTORY }}" -type f | wc -l)
          TOTAL_SIZE=$(du -sh "${{ env.DEPLOY_DIRECTORY }}" | cut -f1)

          echo "| Files | ${FILE_COUNT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Total size | ${TOTAL_SIZE} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "::notice::Payload: ${FILE_COUNT} files, ${TOTAL_SIZE}"

  # ---------------------------------------------------------------------------
  #  3 ▸ Deploy to Cloudflare Pages
  # ---------------------------------------------------------------------------
  deploy:
    name: "🚀 Deploy (${{ needs.preflight.outputs.environment }})"
    runs-on: ubuntu-latest
    needs: [preflight, validate]
    environment:
      name: ${{ needs.preflight.outputs.environment == 'production' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler@${{ env.WRANGLER_VERSION }}

      # -----------------------------------------------------------------------
      #  Ensure the Cloudflare Pages project exists (idempotent)
      # -----------------------------------------------------------------------
      - name: Ensure Cloudflare Pages project exists
        id: ensure_project
        run: |
          echo "::group::Checking if project '${{ env.PROJECT_NAME }}' exists..."

          HTTP_CODE=$(curl -s -o /tmp/cf_response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${{ env.PROJECT_NAME }}")

          if [[ "$HTTP_CODE" == "200" ]]; then
            echo "✅ Project '${{ env.PROJECT_NAME }}' already exists."
            echo "project_status=existing" >> "$GITHUB_OUTPUT"
          elif [[ "$HTTP_CODE" == "404" ]]; then
            echo "⚠️  Project not found. Creating '${{ env.PROJECT_NAME }}'..."

            CREATE_RESPONSE=$(curl -s -w "\n%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{
                "name": "${{ env.PROJECT_NAME }}",
                "production_branch": "main"
              }' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects")

            CREATE_HTTP=$(echo "$CREATE_RESPONSE" | tail -1)
            CREATE_BODY=$(echo "$CREATE_RESPONSE" | sed '$d')

            if [[ "$CREATE_HTTP" == "200" ]] || [[ "$CREATE_HTTP" == "409" ]]; then
              echo "✅ Project created successfully (or already existed, HTTP ${CREATE_HTTP})."
              echo "project_status=created" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Failed to create project (HTTP ${CREATE_HTTP})"
              echo "$CREATE_BODY" | jq . 2>/dev/null || echo "$CREATE_BODY"
              exit 1
            fi
          else
            echo "::error::Unexpected response checking project (HTTP ${HTTP_CODE})"
            cat /tmp/cf_response.json | jq . 2>/dev/null || cat /tmp/cf_response.json
            exit 1
          fi

          echo "::endgroup::"

      # -----------------------------------------------------------------------
      #  Deploy with retries
      # -----------------------------------------------------------------------
      - name: Deploy to Cloudflare Pages
        id: deploy
        run: |
          MAX_RETRIES=3
          RETRY_DELAY=10
          ATTEMPT=0
          DEPLOY_SUCCESS=false

          # Determine branch flag
          BRANCH="${{ needs.preflight.outputs.branch }}"
          ENV="${{ needs.preflight.outputs.environment }}"

          # For production deployments, deploy to the production branch
          if [[ "$ENV" == "production" ]]; then
            BRANCH_FLAG="--branch=main"
          else
            BRANCH_FLAG="--branch=${BRANCH}"
          fi

          echo "::group::Deploying to Cloudflare Pages"
          echo "  Branch flag: ${BRANCH_FLAG}"
          echo "  Project:     ${{ env.PROJECT_NAME }}"
          echo "  Directory:   ${{ env.DEPLOY_DIRECTORY }}"

          while [[ $ATTEMPT -lt $MAX_RETRIES ]]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo ""
            echo "━━━ Attempt ${ATTEMPT}/${MAX_RETRIES} ━━━"

            if OUTPUT=$(wrangler pages deploy "${{ env.DEPLOY_DIRECTORY }}" \
              --project-name="${{ env.PROJECT_NAME }}" \
              ${BRANCH_FLAG} \
              --commit-hash="${{ needs.preflight.outputs.sha_short }}" \
              --commit-message="Deploy ${{ needs.preflight.outputs.sha_short }} → ${ENV}" \
              2>&1); then

              DEPLOY_SUCCESS=true
              echo "✅ Deployment succeeded on attempt ${ATTEMPT}"

              # Extract deployment URL from wrangler output
              DEPLOY_URL=$(echo "$OUTPUT" | grep -oP 'https://[^\s]+' | tail -1)
              if [[ -n "$DEPLOY_URL" ]]; then
                echo "deployment_url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
              else
                echo "deployment_url=https://${{ env.PROJECT_NAME }}.pages.dev" >> "$GITHUB_OUTPUT"
              fi

              echo "$OUTPUT"
              break
            else
              echo "::warning::Attempt ${ATTEMPT} failed."
              echo "$OUTPUT"

              if [[ $ATTEMPT -lt $MAX_RETRIES ]]; then
                echo "Retrying in ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
                RETRY_DELAY=$((RETRY_DELAY * 2))   # exponential backoff
              fi
            fi
          done

          echo "::endgroup::"

          if [[ "$DEPLOY_SUCCESS" != "true" ]]; then
            echo "::error::Deployment failed after ${MAX_RETRIES} attempts."
            exit 1
          fi

          echo "attempts=${ATTEMPT}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      #  Post-deploy health check
      # -----------------------------------------------------------------------
      - name: Health check
        id: health
        if: steps.deploy.outputs.deployment_url != ''
        run: |
          URL="${{ steps.deploy.outputs.deployment_url }}"
          echo "::group::Health check → ${URL}"

          MAX_WAIT=60
          INTERVAL=5
          ELAPSED=0

          while [[ $ELAPSED -lt $MAX_WAIT ]]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")

            if [[ "$HTTP_CODE" == "200" ]] || [[ "$HTTP_CODE" == "304" ]]; then
              echo "✅ Site is live! (HTTP ${HTTP_CODE})"
              echo "health_status=healthy" >> "$GITHUB_OUTPUT"
              break
            fi

            echo "⏳ Waiting for site (HTTP ${HTTP_CODE})... ${ELAPSED}s/${MAX_WAIT}s"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          if [[ $ELAPSED -ge $MAX_WAIT ]]; then
            echo "::warning::Health check timed out after ${MAX_WAIT}s (HTTP ${HTTP_CODE}). The deployment may still be propagating."
            echo "health_status=timeout" >> "$GITHUB_OUTPUT"
          fi

          echo "::endgroup::"

  # ---------------------------------------------------------------------------
  #  4 ▸ Summary
  # ---------------------------------------------------------------------------
  summary:
    name: "📋 Summary"
    runs-on: ubuntu-latest
    needs: [preflight, validate, deploy]
    if: always()
    steps:
      - name: Generate deployment summary
        run: |
          STATUS="${{ needs.deploy.result }}"

          if [[ "$STATUS" == "success" ]]; then
            ICON="✅"
            STATUS_TEXT="Succeeded"
          elif [[ "$STATUS" == "failure" ]]; then
            ICON="❌"
            STATUS_TEXT="Failed"
          elif [[ "$STATUS" == "cancelled" ]]; then
            ICON="⚠️"
            STATUS_TEXT="Cancelled"
          else
            ICON="❓"
            STATUS_TEXT="Unknown"
          fi

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## ${ICON} Deployment ${STATUS_TEXT}

          | Property | Value |
          |----------|-------|
          | **Project** | \`${{ env.PROJECT_NAME }}\` |
          | **Environment** | \`${{ needs.preflight.outputs.environment }}\` |
          | **Branch** | \`${{ needs.preflight.outputs.branch }}\` |
          | **Commit** | \`${{ needs.preflight.outputs.sha_short }}\` |
          | **Timestamp** | \`${{ needs.preflight.outputs.deploy_timestamp }}\` |
          | **URL** | ${{ needs.deploy.outputs.deployment_url || 'N/A' }} |

          ### Pipeline Stages

          | Stage | Status |
          |-------|--------|
          | Pre-flight | ${{ needs.preflight.result == 'success' && '✅' || '❌' }} |
          | Validation | ${{ needs.validate.result == 'success' && '✅' || '❌' }} |
          | Deployment | ${{ needs.deploy.result == 'success' && '✅' || '❌' }} |
          EOF
