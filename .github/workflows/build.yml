name: Build & Package

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: '1.24'

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Get build info
        id: info
        run: |
          echo "COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "VERSION=0.1.0-dev+$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # crackerboxd needs frontend/dist for go:embed
      - name: Scaffold matchboxd frontend placeholder
        run: |
          mkdir -p apps/matchboxd/frontend/dist
          cat > apps/matchboxd/frontend/dist/index.html << 'EOF'
          <!DOCTYPE html><html><head><title>crackerboxd</title></head><body><p>Development build</p></body></html>
          EOF

      # --- Build crackerboxd (linux/amd64 + linux/arm64) ---
      - name: Build crackerboxd (linux/amd64)
        working-directory: apps/matchboxd
        env: { GOOS: linux, GOARCH: amd64, CGO_ENABLED: '0' }
        run: |
          go build -ldflags "-s -w \
            -X crackerboxd/cmd.Version=${{ steps.info.outputs.VERSION }} \
            -X crackerboxd/cmd.GitCommit=${{ steps.info.outputs.COMMIT }} \
            -X crackerboxd/cmd.BuildDate=${{ steps.info.outputs.DATE }}" \
            -o crackerboxd-linux-amd64 .

      - name: Build crackerboxd (linux/arm64)
        working-directory: apps/matchboxd
        env: { GOOS: linux, GOARCH: arm64, CGO_ENABLED: '0' }
        run: |
          go build -ldflags "-s -w \
            -X crackerboxd/cmd.Version=${{ steps.info.outputs.VERSION }} \
            -X crackerboxd/cmd.GitCommit=${{ steps.info.outputs.COMMIT }} \
            -X crackerboxd/cmd.BuildDate=${{ steps.info.outputs.DATE }}" \
            -o crackerboxd-linux-arm64 .

      # --- Build crackerbox-manager (linux/amd64 + linux/arm64) ---
      - name: Build crackerbox-manager (linux/amd64)
        working-directory: apps/manager
        env: { GOOS: linux, GOARCH: amd64, CGO_ENABLED: '0' }
        run: |
          go build -ldflags "-s -w \
            -X github.com/devsprithvi/crakerbox/apps/manager/cmd.Version=${{ steps.info.outputs.VERSION }} \
            -X github.com/devsprithvi/crakerbox/apps/manager/cmd.GitCommit=${{ steps.info.outputs.COMMIT }} \
            -X github.com/devsprithvi/crakerbox/apps/manager/cmd.BuildDate=${{ steps.info.outputs.DATE }}" \
            -o crackerbox-manager-linux-amd64 .

      - name: Build crackerbox-manager (linux/arm64)
        working-directory: apps/manager
        env: { GOOS: linux, GOARCH: arm64, CGO_ENABLED: '0' }
        run: |
          go build -ldflags "-s -w \
            -X github.com/devsprithvi/crakerbox/apps/manager/cmd.Version=${{ steps.info.outputs.VERSION }} \
            -X github.com/devsprithvi/crakerbox/apps/manager/cmd.GitCommit=${{ steps.info.outputs.COMMIT }} \
            -X github.com/devsprithvi/crakerbox/apps/manager/cmd.BuildDate=${{ steps.info.outputs.DATE }}" \
            -o crackerbox-manager-linux-arm64 .

      # --- Tests ---
      - name: Test all
        run: |
          cd apps/matchboxd && go test ./... && cd ../..
          cd apps/manager && go test ./... && cd ../..

      # --- Checksums ---
      - name: Generate checksums
        run: |
          mkdir -p dist
          cp apps/matchboxd/crackerboxd-linux-* dist/
          cp apps/manager/crackerbox-manager-linux-* dist/
          cd dist && sha256sum * > checksums.txt

      # --- Upload as workflow artifacts (always) ---
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crackerbox-dev-${{ steps.info.outputs.COMMIT }}
          path: dist/
          retention-days: 30

      # --- Delete old dev-latest release so we get a clean replace ---
      - name: Delete existing dev-latest release
        if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
        run: gh release delete dev-latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Create fresh dev pre-release on every develop push ---
      - name: Publish dev release
        if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: "🔥 Development Build"
          prerelease: true I
          make_latest: false
          files: dist/*
          body: |
            ## Development Build

            ⚠️ **This is an automated dev build from the `develop` branch — not a stable release.**

            **Commit:** `${{ steps.info.outputs.COMMIT }}`
            **Built:** `${{ steps.info.outputs.DATE }}`

            ### Binaries

            | Binary | Linux amd64 | Linux arm64 |
            |--------|-------------|-------------|
            | **crackerboxd** (daemon) | ✅ | ✅ |
            | **crackerbox-manager** (orchestrator) | ✅ | ✅ |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Deploy website on every develop push ---
      - name: Deploy website to Cloudflare Pages
        if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
        run: npx -y wrangler pages deploy apps/web --project-name=crackerbox
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
