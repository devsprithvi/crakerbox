name: Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-daemon:
    name: Build crackerboxd
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/matchboxd
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: apps/matchboxd/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v -o crackerboxd .

      - name: Test
        run: go test -v ./...

  build-manager:
    name: Build crackerbox-manager
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/manager
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: apps/manager/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v -o crackerbox-manager .

      - name: Test
        run: go test -v ./...

  build-cli:
    name: Build crackerbox CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: apps/cli/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v -o crackerbox .

      - name: Test
        run: go test -v ./...
